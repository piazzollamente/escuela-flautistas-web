<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta regresiva | Escuela de Flautistas</title>
  <meta name="description" content="Cuenta regresiva para masterclass en vivo de Escuela de Flautistas.">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --edf-bg: #0E0E0E;
      --edf-graphite: #181818;
      --edf-red: #C56A5B;
      --edf-mint: #B6D1C1;
      --edf-beige: #E8D6BF;
      --edf-offwhite: #F7F2EC;
      --edf-text-muted: rgba(247, 242, 236, 0.72);
      --edf-line: rgba(232, 214, 191, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 12%, rgba(182, 209, 193, 0.10), transparent 30rem),
        radial-gradient(circle at 86% 70%, rgba(197, 106, 91, 0.11), transparent 28rem),
        linear-gradient(145deg, var(--edf-bg) 0%, var(--edf-graphite) 54%, #0A0A0A 100%);
      color: var(--edf-offwhite);
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(232, 214, 191, 0.028) 1px, transparent 1px),
        linear-gradient(180deg, rgba(232, 214, 191, 0.022) 1px, transparent 1px);
      background-size: 88px 88px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.58), transparent 78%);
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(28px, 4vw, 56px);
    }

    .countdown-shell {
      width: min(1120px, 100%);
      min-height: min(780px, calc(100svh - clamp(56px, 8vw, 112px)));
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: clamp(18px, 3vh, 34px);
      text-align: center;
    }

    .content {
      display: grid;
      justify-items: center;
      gap: clamp(18px, 3vh, 30px);
    }

    .intro {
      display: grid;
      gap: clamp(8px, 1.6vh, 16px);
      justify-items: center;
    }

    .eyebrow {
      color: var(--edf-mint);
      font-size: clamp(0.68rem, 1vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.26em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1 {
      max-width: 960px;
      color: var(--edf-offwhite);
      font-size: clamp(2.5rem, 7vw, 6.8rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--edf-beige);
      font-size: clamp(1.08rem, 2vw, 1.65rem);
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .timer-wrap {
      width: min(100%, 980px);
      padding: clamp(18px, 3vw, 34px) clamp(18px, 4vw, 54px);
      border-top: 1px solid var(--edf-line);
      border-bottom: 1px solid var(--edf-line);
      background: linear-gradient(90deg, transparent, rgba(232, 214, 191, 0.045), transparent);
    }

    .timer {
      display: block;
      color: var(--edf-offwhite);
      font-variant-numeric: tabular-nums;
      font-size: clamp(5.2rem, 19vw, 16rem);
      font-weight: 800;
      letter-spacing: 0.025em;
      line-height: 0.9;
      text-shadow:
        0 0 34px rgba(197, 106, 91, 0.20),
        0 20px 70px rgba(0, 0, 0, 0.48);
    }

    .status {
      min-height: 1.5em;
      color: var(--edf-text-muted);
      font-size: clamp(0.98rem, 1.6vw, 1.28rem);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .status.is-finished {
      color: var(--edf-mint);
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      min-width: 150px;
      min-height: 48px;
      padding: 13px 22px;
      border: 1px solid rgba(232, 214, 191, 0.28);
      border-radius: 999px;
      background: rgba(247, 242, 236, 0.06);
      color: var(--edf-offwhite);
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.15;
      text-transform: uppercase;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(232, 214, 191, 0.50);
      background: rgba(247, 242, 236, 0.10);
    }

    button:focus-visible {
      outline: 3px solid rgba(182, 209, 193, 0.75);
      outline-offset: 4px;
    }

    .primary-action {
      border-color: rgba(197, 106, 91, 0.78);
      background: var(--edf-red);
      color: #160F0D;
      box-shadow: 0 14px 34px rgba(197, 106, 91, 0.18);
    }

    .primary-action:hover {
      border-color: rgba(232, 214, 191, 0.38);
      background: #D37B6D;
    }

    .footer {
      color: rgba(232, 214, 191, 0.62);
      font-size: clamp(0.72rem, 1vw, 0.84rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      main {
        padding: 22px 16px;
      }

      .countdown-shell {
        min-height: calc(100svh - 44px);
      }

      .timer-wrap {
        padding-inline: 12px;
      }

      .timer {
        font-size: clamp(4.5rem, 24vw, 8rem);
      }

      .actions {
        width: min(100%, 360px);
      }

      button {
        width: 100%;
      }
    }

    @media (max-height: 640px) and (orientation: landscape) {
      main {
        padding-block: 18px;
      }

      .countdown-shell {
        min-height: calc(100svh - 36px);
        gap: 12px;
      }

      .content {
        gap: 12px;
      }

      .timer {
        font-size: clamp(4.7rem, 17vw, 10rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <section class="countdown-shell" aria-label="Cuenta regresiva de masterclass">
      <div class="content">
        <header class="intro">
          <p class="eyebrow">Escuela de Flautistas presenta</p>
          <h1 id="page-title">Masterclass Gratuita</h1>
          <p class="subtitle">Tu Voz en la Flauta</p>
        </header>

        <div class="timer-wrap" aria-live="polite" aria-atomic="true">
          <time class="timer" id="timer" datetime="PT10M">10:00</time>
        </div>

        <p class="status" id="status">Comenzamos en unos minutos</p>

        <div class="actions" aria-label="Controles de la cuenta regresiva">
          <button class="primary-action" type="button" id="toggleTimer" aria-pressed="false">Iniciar</button>
          <button type="button" id="resetTimer">Reiniciar</button>
        </div>
      </div>

      <footer class="footer">@escueladeflautistas</footer>
    </section>
  </main>

  <script>
    (function () {
      const duration = 10 * 60;
      const timer = document.getElementById("timer");
      const status = document.getElementById("status");
      const toggleButton = document.getElementById("toggleTimer");
      const resetButton = document.getElementById("resetTimer");

      let secondsRemaining = duration;
      let intervalId = null;

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
      }

      function render() {
        timer.textContent = formatTime(secondsRemaining);
        timer.setAttribute("datetime", "PT" + Math.floor(secondsRemaining / 60) + "M" + (secondsRemaining % 60) + "S");
      }

      function stop() {
        window.clearInterval(intervalId);
        intervalId = null;
        toggleButton.textContent = "Iniciar";
        toggleButton.setAttribute("aria-pressed", "false");
      }

      function finish() {
        stop();
        secondsRemaining = 0;
        render();
        status.textContent = "Ya comenzamos";
        status.classList.add("is-finished");
      }

      function tick() {
        if (secondsRemaining <= 1) {
          finish();
          return;
        }

        secondsRemaining -= 1;
        render();
      }

      toggleButton.addEventListener("click", function () {
        if (intervalId) {
          stop();
          return;
        }

        if (secondsRemaining === 0) {
          secondsRemaining = duration;
        }

        status.textContent = "Comenzamos en unos minutos";
        status.classList.remove("is-finished");
        toggleButton.textContent = "Pausar";
        toggleButton.setAttribute("aria-pressed", "true");
        intervalId = window.setInterval(tick, 1000);
      });

      resetButton.addEventListener("click", function () {
        stop();
        secondsRemaining = duration;
        status.textContent = "Comenzamos en unos minutos";
        status.classList.remove("is-finished");
        render();
      });

      render();
    })();
  </script><script src="/assets/desafio-popup.js?v=41" defer></script></body>
</html>
