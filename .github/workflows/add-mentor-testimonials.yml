name: Agregar testimonios de mentorías

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-mentor-testimonials.yml'

permissions:
  contents: write

jobs:
  actualizar-testimonios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reemplazar testimonios manteniendo el diseño actual
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mentorias.html')
          text = path.read_text(encoding='utf-8')

          old = '''          <article class="testimonial reveal"><blockquote>“Valentina es consciente de los procesos auditivos, corporales y cognitivos que requiere aprender flauta traversa.”</blockquote><footer>Victoria Miranda · Clases online</footer></article>
          <article class="testimonial reveal"><blockquote>“En la clase se generó una confianza muy genuina. Estoy muy feliz con todo lo que me ayudó a corregir.”</blockquote><footer>Ignacio Cabrera · Clases online</footer></article>
          <article class="testimonial reveal"><blockquote>“Jamás imaginé cómo sería tomar clases online y verdaderamente me encantó.”</blockquote><footer>Ana Claudia Catini · Clases online</footer></article>'''

          new = '''          <article class="testimonial reveal"><blockquote>“Valentina es consciente de los procesos auditivos, corporales y cognitivos que requiere aprender flauta traversa.”</blockquote><footer>Victoria Miranda · Clases online</footer></article>
          <article class="testimonial reveal"><blockquote>“Además de ayudarme a ordenar mi estudio y lograr avances que para mí son muy significativos, Valen tiene la habilidad de generar entusiasmo y ganas de seguir estudiando.”</blockquote><footer>Emma Rioseco · Clases online</footer></article>
          <article class="testimonial reveal"><blockquote>“Elegimos estudiar con la profe Vale porque realmente nos acompaña. Llevo desde 2024 estudiando con ella y mis avances son palpables. Lo que más destaco es que ella cree 100 % en nosotras, y eso hace que también confiemos en que podemos avanzar y crecer.”</blockquote><footer>Belén Torres · Estudiante desde 2024</footer></article>'''

          if old not in text:
              raise SystemExit('No se encontró el bloque esperado de testimonios; no se realizaron cambios.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mentorias.html
          git commit -m "Agregar testimonios de Emma y Belén"
          git push
