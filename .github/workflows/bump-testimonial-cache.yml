name: One-time testimonial cache refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-testimonial-cache.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh testimonial script version
        run: |
          sed -i 's|desafio-popup.js?v=40|desafio-popup.js?v=41|g' embocadura-organizada/index.html
          rm .github/workflows/bump-testimonial-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add embocadura-organizada/index.html .github/workflows/bump-testimonial-cache.yml
          git commit -m "Refresh testimonial script cache"
          git push
