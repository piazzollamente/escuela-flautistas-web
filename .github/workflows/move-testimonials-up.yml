name: Mover testimonios arriba

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/move-testimonials-up.yml'

permissions:
  contents: write

jobs:
  mover-testimonios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mover sección de testimonios después de Cómo funciona
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mentorias.html')
          text = path.read_text(encoding='utf-8')

          testimonial_start = text.index('    <section class="section dark" id="testimonios">')
          testimonial_end = text.index('    </section>', testimonial_start) + len('    </section>')
          testimonial_block = text[testimonial_start:testimonial_end]

          text_without = text[:testimonial_start] + text[testimonial_end:]

          process_start = text_without.index('    <section class="section" id="como-funciona">')
          process_end = text_without.index('    </section>', process_start) + len('    </section>')

          updated = text_without[:process_end] + '\n\n' + testimonial_block + text_without[process_end:]
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mentorias.html
          git commit -m "Mover testimonios después de Cómo funciona"
          git push
