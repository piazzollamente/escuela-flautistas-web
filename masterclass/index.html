  <style>
    :root {
      --dark: #393232;
      --ink: #211d1d;
      --white: #fff;
      --off: #f8f6f3;
      --mint: #AEE6DF;
      --red: #C42030;
      --red-deep: #8f1721;
      --line: rgba(57, 50, 50, .12);
      --shadow: 0 24px 80px rgba(33, 29, 29, .16);
      --max: 1040px;
      --sans: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--dark);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 16% 8%, rgba(174, 230, 223, .34), transparent 25rem),
        radial-gradient(circle at 90% 18%, rgba(196, 32, 48, .12), transparent 26rem),
        linear-gradient(180deg, #fff 0%, var(--off) 52%, #fff 100%);
      line-height: 1.55;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(57, 50, 50, .035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(57, 50, 50, .025) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .75), transparent 78%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(var(--max), calc(100% - 36px));
      margin-inline: auto;
    }

    .topbar {
      border-bottom: 1px solid rgba(174, 230, 223, .72);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      display: grid;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: .18em;
      line-height: 1.05;
      font-size: .76rem;
      font-weight: 900;
      color: var(--dark);
    }

    .brand span {
      color: var(--red);
      font-size: .62rem;
      letter-spacing: .23em;
      font-weight: 800;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: .92rem;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      box-shadow: 0 16px 34px rgba(196, 32, 48, .24);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: var(--red-deep);
      box-shadow: 0 22px 44px rgba(196, 32, 48, .30);
    }

    main {
      padding: clamp(38px, 7vw, 80px) 0 clamp(54px, 8vw, 92px);
    }

    .intro {
      max-width: 760px;
      margin-bottom: 28px;
    }

    h1,
    h2 {
      color: var(--dark);
      letter-spacing: 0;
      line-height: 1.02;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      font-weight: 900;
      margin-bottom: 16px;
    }

    .subtitle {
      max-width: 620px;
      color: rgba(57, 50, 50, .76);
      font-size: clamp(1.02rem, 2vw, 1.22rem);
      font-weight: 600;
      margin-bottom: 24px;
    }

    .content {
      display: grid;
      gap: 34px;
    }

    .block {
      display: grid;
      gap: 16px;
    }

    h2 {
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      font-weight: 900;
    }

    .embed-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 24px;
      background: var(--ink);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .embed-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .external-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 44px;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(196, 32, 48, .24);
      color: var(--red);
      background: rgba(255, 255, 255, .72);
      font-size: .9rem;
      font-weight: 850;
    }

    .external-link:hover {
      color: var(--red-deep);
      background: rgba(174, 230, 223, .18);
    }

    footer {
      width: min(var(--max), calc(100% - 36px));
      margin: auto;
      padding: 28px 0 42px;
      border-top: 1px solid rgba(57, 50, 50, .10);
      color: rgba(57, 50, 50, .62);
      font-size: .9rem;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      .topbar-inner {
        min-height: 66px;
      }

      .brand {
        font-size: .7rem;
      }

      .brand span {
        font-size: .58rem;
      }

      .topbar .btn {
        display: none;
      }

      .btn,
      .external-link {
        width: 100%;
      }

      .embed-frame {
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
